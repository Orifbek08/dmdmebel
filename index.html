function panelSahifa(){
  var h=planHisob(S.oy), l=oySatrlar(S.oy), j=jam(l);
  var kecha=new Date(); kecha.setHours(0,0,0,0); kecha.setDate(kecha.getDate()-1);
  var kl=(D.sotuv||[]).filter(function(x){ return x.sana===iso(kecha) }), kj=jam(kl);
  var bl=(D.sotuv||[]).filter(function(x){ return x.sana===iso(new Date()) }), bj=jam(bl);

  var o=sarlavha('DMD Mebel — бошқарув панели', oyMatn(S.oy)+' · план ва сотув хулосаси', oyTanlagich());

  o+='<div class="sec" style="margin-top:4px"><h2>План · факт · қолди</h2>'+
     '<p>План — «План» варағидан; факт — «База»даги '+esc(oyMatn(S.oy))+' сотувлари йиғиндиси</p></div>';
  o+= h.bor ? rjTor(h)
            : '<div class="empty"><b>'+esc(oyMatn(S.oy))+' учун план киритилмаган</b>«План» варағига шу ой блокини қўшинг</div>';
  if(h.farq.length) o+=farqIzoh(h);

  o+='<div class="sec"><h2>Асосий рақамлар</h2><p>'+esc(oyMatn(S.oy))+' бўйича</p></div>'+
  '<div class="mets">'+
    '<div class="met k"><div class="met-l">Ой тушуми</div><div class="met-v num">'+pul(j.summa)+'</div>'+
      '<div class="met-d">«Цена» йиғиндиси · планнинг '+foizMatn(h.jami.foiz)+'</div>'+
      '<div class="mprog"><i style="width:'+Math.min(100,h.jami.foiz)+'%;background:'+(h.jami.foiz>=100?'var(--ok)':'var(--a)')+'"></i></div></div>'+
    '<div class="met"><div class="met-l">Сотувлар</div><div class="met-v num">'+fmt(j.soni)+'</div>'+
      '<div class="met-d">'+(miqdorMatn(j.birlik)||'битта қатор = битта сотув')+'</div></div>'+
    '<div class="met o"><div class="met-l">Ўртача чек</div><div class="met-v num">'+pul(j.ortacha)+'</div>'+
      '<div class="met-d">тушум ÷ сотувлар сони</div></div>'+
    '<div class="met"><div class="met-l">Кеча</div><div class="met-v num">'+pul(kj.summa)+'</div>'+
      '<div class="met-d">'+kecha.getDate()+' '+OY_NOM[kecha.getMonth()]+', '+HAFTA_KUN[kecha.getDay()]+' · '+fmt(kj.soni)+' та сотув · бугун '+pul(bj.summa)+'</div></div>'+
  '</div>';

  var mag=guruhla(l,function(x){ return x.magazin });
  var mas=guruhla(l,function(x){ return x.masul }).slice(0,6);
  o+='<div class="two" style="margin-top:26px">'+
     '<div><div class="sec" style="margin-top:0"><h2>Магазин</h2><p>Онлайн ва офлайн тушуми</p></div>'+
       '<div class="panel">'+ustunlar(mag.map(function(x){ return {nom:x.nom,qiy:x.summa,matn:pul(x.summa),ong:x.soni+' та · '+foizMatn(j.summa?x.summa/j.summa*100:0)} }))+'</div></div>'+
     '<div><div class="sec" style="margin-top:0"><h2>Масъуллар</h2><p>Ким қанча сотди (юқори 6 таси)</p></div>'+
       '<div class="panel">'+ustunlar(mas.map(function(x){ return {nom:x.nom,qiy:x.summa,matn:pul(x.summa),ong:x.soni+' та сотув'} }))+'</div></div>'+
  '</div>';

  o+=bolim('Сотув динамикаси',esc(oyMatn(S.oy))+' — ҳар бир даврда тушган сумма',davrQatori(l)+dinamika(l));

  o+='<div class="sec sec-t"><div><h2>Сўнгги сотувлар</h2><p>'+esc(oyMatn(S.oy))+'даги охирги 6 таси</p></div>'+
       '<button class="btn" data-prodga="sotuv" data-sahifaga="jurnal">Барча сотувлар →</button></div>'+
     '<div class="panel">'+sotuvRoyxat(l,6)+'</div>';

  o+='<div class="sec"><h2>Бошқа бўлимлар</h2><p>Жадваллари тайёр бўлгач уланади</p></div><div class="tzq">'+
    PRODLAR.filter(function(p){ return p.yoq }).map(function(p){
      return '<button class="tzk" data-prodga="'+p.p+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+IKONKA[p.ik]+'</svg>'+
        '<div><b>'+esc(p.nom)+'</b><span>тез орада</span></div></button>';
    }).join('')+'</div>';
  return o;
}

function farqIzoh(h){
  return '<div class="fizoh" style="margin-top:14px"><div class="eb">«План» варағидаги «Факт» билан фарқ бор</div><p>'+
    h.farq.map(function(q){ return esc(q.nom)+': варақда '+pul(q.varaqFakt)+', «База» бўйича '+pul(q.fakt) }).join(' · ')+
    '</p><p>Панел фактни «База» варағидаги сотувлардан ўзи ҳисоблайди — шунинг учун у доим сотувлар рўйхатига мос келади.</p></div>';
}

/* ── 9.1 УМУМИЙ ── */
function sotuvUmumiy(){
  var l=satrlar(), j=jam(l);
  var onl=0; l.forEach(function(x){ if(kalit(x.magazin)==='онлайн') onl+=x.summa });
  var pro=guruhla(l,function(x){ return x.produkt });
  var mag=guruhla(l,function(x){ return x.magazin });
  var mod=guruhla(l,function(x){ return x.tur||'Кўрсатилмаган' }).slice(0,10);

  var o=sarlavha('Сотув — умумий','Тушум, маҳсулотлар, магазин ва динамика',magazinFiltr()+sanaFiltr())+
  '<div class="mets">'+
    '<div class="met k"><div class="met-l">Тушум</div><div class="met-v num">'+pul(j.summa)+'</div>'+
      '<div class="met-d">«Цена» устуни йиғиндиси</div></div>'+
    '<div class="met"><div class="met-l">Сотувлар</div><div class="met-v num">'+fmt(j.soni)+'</div>'+
      '<div class="met-d">'+(miqdorMatn(j.birlik)||'танланган даврда')+'</div></div>'+
    '<div class="met o"><div class="met-l">Ўртача чек</div><div class="met-v num">'+pul(j.ortacha)+'</div>'+
      '<div class="met-d">тушум ÷ сотувлар сони</div></div>'+
    '<div class="met"><div class="met-l">Онлайн улуши</div><div class="met-v num">'+foizMatn(j.summa?onl/j.summa*100:0)+'</div>'+
      '<div class="met-d">онлайн '+pul(onl)+' · қолгани '+pul(j.summa-onl)+'</div></div>'+
  '</div>';

  o+=bolim('Маҳсулотлар','Қайси маҳсулот қанча тушум берди',
    ustunlar(pro.map(function(x){ return {nom:x.nom,qiy:x.summa,matn:pul(x.summa),ost:miqdorMatn(x.birlik),ong:x.soni+' та · '+foizMatn(j.summa?x.summa/j.summa*100:0)} })));

  o+='<div class="two" style="margin-top:16px">'+
     '<div><div class="sec" style="margin-top:0"><h2>Магазин</h2><p>Онлайн ва офлайн</p></div>'+
       '<div class="panel">'+ustunlar(mag.map(function(x){ return {nom:x.nom,qiy:x.summa,matn:pul(x.summa),ong:x.soni+' та сотув'} }))+'</div></div>'+
     '<div><div class="sec" style="margin-top:0"><h2>Модель</h2><p>«Тип» устуни бўйича (юқори 10 таси)</p></div>'+
       '<div class="panel">'+ustunlar(mod.map(function(x){ return {nom:x.nom,qiy:x.summa,matn:pul(x.summa),ong:x.soni+' та сотув'} }))+'</div></div>'+
  '</div>';

  o+=bolim('Сотув динамикаси','Ҳар бир даврда тушган сумма',davrQatori(l)+dinamika(l));
  o+=hozirIzoh(l);
  return o;
}

/* ── 9.2 МАСЪУЛЛАР ва 9.3 МАҲСУЛОТЛАР — карта → батафсил ── */
function kartaSahifa(tur){
  var masul=tur==='masul';
  var l=satrlar(), j=jam(l);
  var gr=guruhla(l, masul?function(x){ return x.masul }:function(x){ return x.produkt });
  var kor=S.qidiruv ? gr.filter(function(x){ return x.nom.toLowerCase().indexOf(S.qidiruv.toLowerCase())>=0 }) : gr;
  var max=gr.length?gr[0].summa:1, ochiq=null;
  gr.forEach(function(x){ if(x.nom===S.ochiq) ochiq=x });

  var o=sarlavha(masul?'Масъуллар':'Маҳсулотлар',
    masul?'Ким қанча сотган — батафсил учун босинг':'Қайси маҳсулот қанча сотилган — батафсил учун босинг',
    '<input type="text" id="qid" placeholder="'+(masul?'Исм бўйича қидириш':'Маҳсулот бўйича қидириш')+'" value="'+esc(S.qidiruv)+'" style="width:190px">'+
    magazinFiltr()+sanaFiltr());

  o+='<div class="grid">'+(kor.length?kor.map(function(x){
    var n=gr.indexOf(x);
    return '<button class="card '+(S.ochiq===x.nom?'sel':'')+'" data-och="'+esc(x.nom)+'">'+
      '<span class="rank">#'+(n+1)+'</span>'+
      '<div class="cn">'+esc(x.nom)+'</div>'+
      '<div class="cm">'+fmt(x.soni)+' та сотув'+(miqdorMatn(x.birlik)?' · '+miqdorMatn(x.birlik):'')+'</div>'+
      '<div class="cq"><b class="num">'+pul(x.summa)+'</b><span>'+foizMatn(j.summa?x.summa/j.summa*100:0)+'</span></div>'+
      '<div class="cbar"><i style="width:'+Math.max(3,x.summa/max*100)+'%;background:'+rang(n)+'"></i></div>'+
    '</button>';
  }).join(''):bosh(masul?'Масъул топилмади':'Маҳсулот топилмади'))+'</div>';

  if(ochiq) o+=kartaDetal(ochiq,masul);
  o+=hozirIzoh(l);
  return o;
}

function kartaDetal(g,masul){
  var a=guruhla(g.satrlar, masul?function(x){ return x.produkt }:function(x){ return x.tur||'Кўрсатилмаган' });
  var b=guruhla(g.satrlar, masul?function(x){ return x.magazin }:function(x){ return x.masul });
  function us(l){ return ustunlar(l.map(function(x){ return {nom:x.nom,qiy:x.summa,matn:pul(x.summa),ost:miqdorMatn(x.birlik),ong:x.soni+' та сотув'} })) }
  return '<div class="detail">'+
    '<div class="dh"><div class="dm"><h3>'+esc(g.nom)+'</h3>'+
      '<div class="chips">'+
        '<span class="chip">Сотув: <b>'+fmt(g.soni)+'</b></span>'+
        '<span class="chip k">Тушум <b>'+pul(g.summa)+'</b></span>'+
        '<span class="chip">Ўртача чек <b>'+pul(g.soni?g.summa/g.soni:0)+'</b></span>'+
        (miqdorMatn(g.birlik)?'<span class="chip">Миқдор <b>'+esc(miqdorMatn(g.birlik))+'</b></span>':'')+
      '</div></div>'+
      '<button class="btn" data-yop>Ёпиш</button></div>'+
    '<div class="dbody"><div class="eb">'+(masul?'Нима сотган':'Моделлар («Тип»)')+'</div>'+us(a)+'</div>'+
    '<div class="dbody"><div class="eb">'+(masul?'Қайси магазинда':'Ким сотган')+'</div>'+us(b)+'</div>'+
    '<div class="dbody"><div class="eb">Сотувлар</div>'+sotuvRoyxat(g.satrlar)+'</div>'+
  '</div>';
}

/* ── 9.4 ПЛАН ── */
function sotuvPlan(){
  var h=planHisob(S.oy);
  var o=sarlavha('План',oyMatn(S.oy)+' · план, факт ва қолди маҳсулотлар бўйича',oyTanlagich());
  if(!h.bor && !h.qat.length)
    return o+'<div class="empty"><b>'+esc(oyMatn(S.oy))+' учун план киритилмаган</b>«План» варағига шу ой блокини қўшинг</div>';

  o+='<div class="mets">'+
    '<div class="met o"><div class="met-l">План</div><div class="met-v num">'+pul(h.jami.reja)+'</div>'+
      '<div class="met-d">«План» варағидан · '+h.qat.filter(function(q){ return !q.plansiz }).length+' та маҳсулот</div></div>'+
    '<div class="met k"><div class="met-l">Факт</div><div class="met-v num">'+pul(h.jami.fakt)+'</div>'+
      '<div class="met-d">«База»дан · '+fmt(h.jami.soni)+' та сотув</div></div>'+
    '<div class="met c"><div class="met-l">Қолди</div><div class="met-v num">'+pul(h.jami.qoldi)+'</div>'+
      '<div class="met-d">план − факт</div></div>'+
    '<div class="met"><div class="met-l">Бажарилди</div><div class="met-v num">'+foizMatn(h.jami.foiz)+'</div>'+
      '<div class="met-d">факт ÷ план</div>'+
      '<div class="mprog"><i style="width:'+Math.min(100,h.jami.foiz)+'%;background:'+foizRang(h.jami.foiz)+'"></i></div></div>'+
  '</div>';

  o+='<div class="sec"><h2>План · факт · қолди</h2><p>Ҳар бир маҳсулот бўйича</p></div>'+rjTor(h);
  o+=bolim('Бажарилиш','Рангли чизиқ — факт, тик чизиқ — план даражаси',rejaUstun(h.qat));

  o+='<div class="sec"><h2>Жадвал</h2><p>'+esc(oyMatn(S.oy))+'</p></div>'+
    '<div class="tw" style="display:block"><div class="tscroll"><table class="tbl"><thead><tr>'+
    '<th>Маҳсулот</th><th style="text-align:right">План</th><th style="text-align:right">Факт</th>'+
    '<th style="text-align:right">Қолди</th><th style="text-align:right">%</th><th style="text-align:right">Сотув</th></tr></thead><tbody>'+
    h.qat.concat([h.jami]).map(function(q,i,a){
      var jami=i===a.length-1;
      return '<tr'+(jami?' style="font-weight:600"':'')+'><td style="color:var(--ink);font-weight:'+(jami?600:500)+'">'+esc(q.nom)+(q.plansiz?' <span class="pill">плансиз</span>':'')+'</td>'+
        '<td class="num" style="text-align:right">'+(q.plansiz?'—':pul(q.reja))+'</td>'+
        '<td class="num" style="text-align:right;color:var(--ok)">'+pul(q.fakt)+'</td>'+
        '<td class="num" style="text-align:right;color:var(--no)">'+(q.plansiz?'—':pul(q.qoldi))+'</td>'+
        '<td class="num" style="text-align:right;color:'+(q.plansiz?'var(--muted)':foizRang(q.foiz))+'">'+(q.plansiz?'—':foizMatn(q.foiz))+'</td>'+
        '<td class="num" style="text-align:right;color:var(--muted)">'+fmt(q.soni)+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';

  if(h.farq.length) o+=farqIzoh(h);
  o+='<div class="fizoh"><div class="eb">Ҳозир нима кўрсатилмоқда</div>'+
    '<p>Ой: <b>'+esc(oyMatn(S.oy))+'</b>. План — «План» варағидаги шу ой блокидан. Факт — «База» варағидаги шу ой сотувларининг '+
    '«Цена» йиғиндиси (маҳсулот номи бўйича). Қолди = план − факт (манфий бўлмайди). Бажарилди = факт ÷ план.</p></div>';
  return o;
}

/* ── 9.5 СОТУВЛАР (журнал) ── */
function sotuvJurnal(){
  var l=satrlar();
  if(S.qidiruv){
    var q=S.qidiruv.toLowerCase();
    l=l.filter(function(x){ return [x.masul,x.produkt,x.tur,x.magazin,dfmt(x.sana)].join(' ').toLowerCase().indexOf(q)>=0 });
  }
  l=l.slice().sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) });
  var j=jam(l);
  var o=sarlavha('Сотувлар','«База» варағи — ҳар бир қатор битта сотув',
    '<input type="text" id="qid" placeholder="Масъул, маҳсулот, модель…" value="'+esc(S.qidiruv)+'" style="width:210px">'+
    magazinFiltr()+sanaFiltr());
  o+='<div class="mets" style="grid-template-columns:repeat(2,1fr);max-width:520px">'+
    '<div class="met"><div class="met-l">Сотувлар</div><div class="met-v num">'+fmt(j.soni)+'</div><div class="met-d">'+(miqdorMatn(j.birlik)||'танланган даврда')+'</div></div>'+
    '<div class="met k"><div class="met-l">Тушум</div><div class="met-v num">'+pul(j.summa)+'</div><div class="met-d">«Цена» йиғиндиси</div></div></div>';

  o+='<div class="tw"><div class="tscroll"><table class="tbl"><thead><tr>'+
    '<th>Сана</th><th>Магазин</th><th>Масъул</th><th>Маҳсулот</th><th>Модель</th>'+
    '<th style="text-align:right">Миқдор</th><th style="text-align:right">Сумма</th></tr></thead><tbody>'+
    (l.length?l.map(function(x){
      return '<tr><td class="num" style="color:var(--muted)">'+dfmt(x.sana)+'</td>'+
        '<td><span class="pill">'+esc(x.magazin)+'</span></td>'+
        '<td style="font-weight:500;color:var(--ink)">'+esc(x.masul)+'</td>'+
        '<td>'+esc(x.produkt)+'</td>'+
        '<td style="color:var(--muted)">'+esc(x.tur||'—')+'</td>'+
        '<td class="num" style="text-align:right">'+(x.soni?fmt(x.soni)+' <span class="miq">'+esc(x.birlik||'')+'</span>':'—')+'</td>'+
        '<td class="num" style="text-align:right;font-weight:600;color:var(--green)">'+pul(x.summa)+'</td></tr>';
    }).join(''):'<tr><td colspan="7" style="padding:26px;text-align:center;color:var(--muted)">Сотув топилмади</td></tr>')+
    '</tbody></table></div></div>';

  o+='<div class="jfaqat">'+(l.length?sotuvRoyxat(l):bosh('Сотув топилмади'))+'</div>';
  o+=hozirIzoh(l);
  return o;
}


/* ══════════════════════════════════════════════════════
   10. ҲАЛИ УЛАНМАГАН БЎЛИМЛАР (Маркетинг, Молия, Склад)
   ══════════════════════════════════════════════════════ */

function ulanmaganSahifa(){
  var p=prodTop(S.prod);
  return '<div class="head"><div><h1>'+esc(p.nom)+'</h1><div class="sub">Тез орада</div></div><div class="tools"></div></div>'+
    '<div class="ulq">'+
      '<div class="ulq-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>'+
      '<b>'+esc(p.nom)+' — тез орада</b>'+
      '<p>'+esc(p.izoh)+'.<br>Бу бўлим учун жадвал (Google Sheets) ҳали уланмаган. Жадвал тайёр бўлганда шу ерда жонли маълумот чиқади.</p>'+
      '<div class="ulq-t">'+
        '<button class="btn btn-o" data-prodga="panel">Бошқарув панели</button>'+
        '<button class="btn" data-prodga="sotuv">Сотув</button>'+
      '</div>'+
    '</div>';
}


/* ══════════════════════════════════════════════════════
   11. ЧИЗИШ
   ══════════════════════════════════════════════════════ */

var IKONKA={
  panel:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  savat:'<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  pul:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  quti:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
  odam:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
  mebel:'<path d="M3 12V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5"/><path d="M2 12h20v5H2zM5 17v2M19 17v2"/>',
  nishon:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  jadval:'<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/>',
  voronka:'<path d="M3 4h18l-7 8v6l-4 2v-8z"/>'
};
function ikon(k){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+IKONKA[k]+'</svg>' }

/** «Сотув» ичидаги бўлимлар: чап менюда ва пастки панелда — бир хил тартибда */
function menyu(){
  if(S.prod!=='sotuv') return [];
  var l=D?satrlar():[];
  return [
    {p:'umumiy', nom:'Умумий',      ik:'chart'},
    {p:'menejer',nom:'Масъуллар',   ik:'odam',   son:D?guruhla(l,function(x){ return x.masul }).length:null},
    {p:'kesim',  nom:'Маҳсулотлар', ik:'mebel',  son:D?guruhla(l,function(x){ return x.produkt }).length:null},
    {p:'plan',   nom:'План',        ik:'nishon'},
    {p:'jurnal', nom:'Сотувлар',    ik:'jadval', son:D?l.length:null}];
}

function prodChiz(){
  document.getElementById('prodlar').innerHTML=PRODLAR.map(function(p){
    return '<button class="ni'+(p.yoq?' yoq':'')+(S.prod===p.p?' on':'')+'" data-prod="'+p.p+'">'+
      '<span class="ik">'+ikon(p.ik)+'</span><span class="nt">'+esc(p.nom)+'</span>'+
      (p.yoq?'<em class="tez">тез орада</em>':'')+'</button>';
  }).join('');
}

function chiz(){
  prodChiz();
  var m=menyu();
  document.body.classList.toggle('bnyoq',m.length<2);
  ['#side','#bnav'].forEach(function(joy){
    var n=document.querySelectorAll(joy+' .ni[data-p]');
    for(var i=0;i<n.length;i++){
      var b=m[i];
      if(!b){ n[i].style.display='none'; continue }
      n[i].style.display='';
      n[i].dataset.p=b.p;
      n[i].querySelector('.ik').innerHTML=ikon(b.ik);
      n[i].querySelector('.nt').textContent=b.nom;
      var sn=n[i].querySelector('.nson');
      if(sn){
        var bor=(b.son||b.son===0);
        sn.textContent=bor?fmt(b.son):'';
        sn.style.display=bor?'':'none';
      }
      n[i].classList.toggle('on',b.p===S.sahifa);
    }
  });
  var tp=document.getElementById('tbProd'), joriy=null;
  m.forEach(function(b){ if(b.p===S.sahifa) joriy=b });
  if(tp) tp.textContent=prodTop(S.prod).nom+(joriy&&S.prod==='sotuv'?' · '+joriy.nom:'');

  if(yoqMi()){ main.innerHTML=ulanmaganSahifa(); return }
  var hol=ulanishHolat();
  if(hol){ main.innerHTML=hol; return }

  main.innerHTML = S.prod==='panel' ? panelSahifa()
    : S.sahifa==='umumiy'  ? sotuvUmumiy()
    : S.sahifa==='menejer' ? kartaSahifa('masul')
    : S.sahifa==='kesim'   ? kartaSahifa('produkt')
    : S.sahifa==='plan'    ? sotuvPlan()
    : sotuvJurnal();
}


/* ══════════════════════════════════════════════════════
   12. ҲОДИСАЛАР
   ══════════════════════════════════════════════════════ */

function tepaga(){ main.scrollTop=0; window.scrollTo(0,0) }

function sahifaOch(nom){
  S.sahifa=nom; S.ochiq=null; S.qidiruv='';
  chiz(); tepaga();
}

function produktOch(p,sahifa){
  S.prod=p; S.sahifa=sahifa||'umumiy'; S.ochiq=null; S.qidiruv='';
  // Фильтрни тозалаймиз: акс ҳолда «Бугун» қолиб кетиб, янги бўлим сабабсиз бўм-бўш кўринади
  S.oraliq='hammasi'; S.magazin='hammasi'; S.dan=null; S.gacha=null;
  chiz(); tepaga();
}

var navlar=document.querySelectorAll('.ni[data-p]');
for(var i=0;i<navlar.length;i++)
  navlar[i].onclick=function(){ sahifaOch(this.dataset.p) };

document.getElementById('prodlar').addEventListener('click',function(e){
  var t=e.target.closest('[data-prod]');
  if(t) produktOch(t.dataset.prod);
});

main.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-prodga]'))){ produktOch(t.dataset.prodga,t.dataset.sahifaga); return }

  /* ── фильтрлар ── */
  if((t=e.target.closest('[data-o]'))){
    S.oraliq=t.dataset.o;
    if(S.oraliq!=='oraliq'){ S.dan=null; S.gacha=null }
    chiz(); return;
  }
  if((t=e.target.closest('[data-mag]'))){ S.magazin=t.dataset.mag; S.ochiq=null; chiz(); return }
  if(e.target.closest('[data-tozala]')){ S.oraliq='hammasi'; S.magazin='hammasi'; S.dan=null; S.gacha=null; chiz(); return }
  if(e.target.closest('#qollaBtn')){
    var a=document.getElementById('dan').value, b=document.getElementById('gacha').value;
    if(!a&&!b){ xabar('Санани танланг',true); return }
    S.tmpDan=a; S.tmpGacha=b; S.dan=a||null; S.gacha=b||null;
    chiz(); xabar('Сана қўлланди'); return;
  }
  if((t=e.target.closest('[data-davr]'))){ S.davr=t.dataset.davr; chiz(); return }

  /* ── ой танлаш ── */
  if((t=e.target.closest('[data-oyq]'))){
    var l=planOylar(), n=l.indexOf(S.oy)+(+t.dataset.oyq);
    if(n>=0 && n<l.length){ S.oy=l[n]; chiz() }
    return;
  }

  /* ── карта → батафсил ── */
  if((t=e.target.closest('[data-och]'))){
    var nom=t.getAttribute('data-och');
    S.ochiq=(S.ochiq===nom)?null:nom; chiz();
    var d=main.querySelector('.detail');
    if(d && S.ochiq) d.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  if(e.target.closest('[data-yop]')){ S.ochiq=null; chiz(); return }

  if(e.target.closest('#eskiYangila')){ hammasiYangila(); return }
  if(e.target.closest('#qaytaBtn')){ yukla(); return }
});

main.addEventListener('input',function(e){
  if(e.target.id==='qid'){
    S.qidiruv=e.target.value;
    var joy=e.target.selectionStart;
    chiz();
    var n=document.getElementById('qid');
    if(n){ n.focus(); n.setSelectionRange(joy,joy) }
  }
  if(e.target.id==='dan')   S.tmpDan=e.target.value;
  if(e.target.id==='gacha') S.tmpGacha=e.target.value;
});

function hammasiYangila(){
  if(!ulangan()){ xabar('Скрипт ҳали уланмаган — намуна кўрсатилмоқда'); return }
  xabar('Янгиланмоқда…');
  S.yangi=true;                       // сервердаги кэшни четлаб ўтамиз
  yukla(true);
  setTimeout(function(){ S.yangi=false },4000);
}
document.getElementById('yangilaBtn').onclick=hammasiYangila;
document.getElementById('yangilaBtn2').onclick=hammasiYangila;

/* ── чап меню: очиш / ёпиш ── */
function telefonmi(){ return window.matchMedia('(max-width:820px)').matches }
function menyuHolat(ochiq){
  document.body.classList.toggle('yopiq',!ochiq);
  try{ if(!telefonmi()) localStorage.setItem(MENYU,ochiq?'1':'0') }catch(e){}
}
function menyuAlmash(){ menyuHolat(document.body.classList.contains('yopiq')) }
document.getElementById('burger').onclick=menyuAlmash;
document.getElementById('ovl').onclick=function(){ menyuHolat(false) };

/* Телефонда бўлим танлангач меню ўзи ёпилади */
document.getElementById('side').addEventListener('click',function(e){
  if(telefonmi() && e.target.closest('.ni[data-p],.ni[data-prod]')) menyuHolat(false);
});

/* Дастлабки ҳолат: компьютерда очиқ, телефонда ёпиқ */
(function(){
  var v=null;
  try{ v=localStorage.getItem(MENYU) }catch(e){}
  menyuHolat(telefonmi() ? false : v!=='0');
})();

/* ── ранг режими ── */
function temaQoy(qora,eslab){
  document.body.classList.toggle('oq',!qora);
  var s=document.querySelector('#temaBtn span');
  if(s) s.textContent=qora?'Оқ режим':'Қора режим';
  var m=document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content',qora?'#0B0D10':'#F4F2ED');
  if(eslab){ try{ localStorage.setItem(TEMA,qora?'qora':'oq') }catch(e){} }
}
function temaAlmash(){ temaQoy(!qoraMi(),true); if(D||yoqMi()) chiz() }
document.getElementById('temaBtn').onclick=temaAlmash;
document.getElementById('temaBtn2').onclick=temaAlmash;

var tid;
function xabar(m,xato){
  var t=document.getElementById('toast');
  t.textContent=m; t.className='toast on'+(xato?' err':'');
  clearTimeout(tid); tid=setTimeout(function(){ t.className='toast' },3000);
}

/* Экран КЕНГЛИГИ ўзгарса — чизма қайта ҳисобланади.
   (Телефонда суриш пайтида фақат баландлик ўзгаради — у ҳисобга олинмайди.) */
var oid, oxKen=window.innerWidth;
window.addEventListener('resize',function(){
  if(window.innerWidth===oxKen) return;
  oxKen=window.innerWidth;
  clearTimeout(oid);
  oid=setTimeout(function(){
    var a=document.activeElement;
    if(D && !yoqMi() && !(a && a.tagName==='INPUT')) chiz();
  },200);
});

/* ── ишга тушириш ── */
(function(){
  var v=null;
  try{ v=localStorage.getItem(TEMA) }catch(e){}
  temaQoy(v!=='oq',false);
})();
prodChiz();
boshla();
</script>
</body>
</html>
